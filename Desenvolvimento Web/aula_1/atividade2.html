<!-- 3. Crie o HTML de um formulário de cadastro universitário contendo: nome, e-mail,
matrícula (número), curso (select com 3 opções) e um checkbox 'Aceito os termos de uso'. Todos os
campos devem ter labels corretos e o campo e-mail deve ser obrigatório. -->

  <form action="/cadastro" method="POST">
    <label for="nome">Nome:</label>
    <input type="text" id="nome">

    <label for="email">E-mail:</label>
    <input type="email" id="email" required>

    <label for="matricula">Matrícula:</label>
    <input type="number" id="email">

    <label for="curso">Curso:</label>
    <select id="curso">
      <option>Ciência da computação</option>
      <option>Engenharia de software</option>
      <option>Analise de dados</option>
    </select>

    <input type="checkbox" id="opcao" name="termos" value="html">
    <label for="opcao1">Aceito os termos de uso</label>


    <button type="submit">Enviar</button>
  </form>

  <!-- Adicione ao currículo do projeto uma seção <section id='educacao'> contendo uma tabela
com pelo menos 2 cursos realizados (colunas: Instituição, Curso, Ano de Conclusão). Use thead e
tbody.
 -->
<section id="educacao">
      <h2>Educação</h2>
      <table>
        <thead>
          <tr>
            <th>Curso</th>
            <th>Nível</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Engenharia de software</td>
            <td>Superior</td>
          </tr>
          <tr>
            <td>Administração</td>
            <td>Superior</td>
          </tr>
        </tbody>
      </table>
    </section>
